<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1512 860" width="1512" height="860" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">

  <!-- White background -->
  <rect width="1512" height="860" fill="#ffffff"/>

  <!-- ── Service endpoints heading ── -->
  <text x="24" y="38" font-size="22" font-weight="600" fill="#161616">Service endpoints</text>

  <!-- Tab bar bottom border -->
  <rect x="0" y="52" width="1512" height="1" fill="#e0e0e0"/>

  <!-- Elasticsearch tab (active) -->
  <rect x="0" y="53" width="140" height="38" fill="#ffffff"/>
  <text x="70" y="77" font-size="14" font-weight="600" fill="#161616" text-anchor="middle">Elasticsearch</text>
  <rect x="0" y="88" width="140" height="3" fill="#0f62fe"/>

  <!-- CLI tab -->
  <rect x="140" y="53" width="70" height="38" fill="#f4f4f4"/>
  <text x="175" y="77" font-size="14" fill="#525252" text-anchor="middle">CLI</text>

  <!-- ── Grey panel ── -->
  <rect x="0" y="110" width="1512" height="400" fill="#f4f4f4"/>

  <!-- Private endpoints only badge -->
  <rect x="24" y="148" width="172" height="28" rx="14" fill="#ffd6e8"/>
  <text x="110" y="167" font-size="12" fill="#9f1853" text-anchor="middle">Private endpoints only</text>

  <!-- Private connection tutorial link -->
  <text x="1310" y="167" font-size="13" fill="#0f62fe">Private connection tutorial</text>
  <!-- small document icon -->
  <rect x="1442" y="156" width="13" height="15" rx="1" fill="none" stroke="#0f62fe" stroke-width="1.3"/>
  <line x1="1446" y1="161" x2="1452" y2="161" stroke="#0f62fe" stroke-width="1"/>
  <line x1="1446" y1="165" x2="1452" y2="165" stroke="#0f62fe" stroke-width="1"/>

  <!-- Endpoint label -->
  <text x="24" y="222" font-size="13" fill="#525252">Endpoint</text>

  <!-- Endpoint text box -->
  <rect x="24" y="232" width="1464" height="46" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="42" y="260" font-size="13" fill="#161616" font-family="'IBM Plex Mono', 'Courier New', monospace">https://$ESUSER:$ESPASSWORD@d2d6b7c6-31f3-476d-8987-b11c551e9990.private.uhp.ca-mon.elasticsearch.dataservices.appdomain.cloud:9200</text>
  <!-- Copy icon -->
  <rect x="1458" y="244" width="17" height="17" rx="2" fill="none" stroke="#525252" stroke-width="1.2"/>
  <rect x="1462" y="240" width="17" height="17" rx="2" fill="#ffffff" stroke="#525252" stroke-width="1.2"/>

  <!-- Hostname / Port labels -->
  <text x="24" y="318" font-size="13" fill="#525252">Hostname</text>
  <text x="778" y="318" font-size="13" fill="#525252">Port</text>

  <!-- Hostname box -->
  <rect x="24" y="328" width="728" height="46" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="42" y="356" font-size="13" fill="#161616" font-family="'IBM Plex Mono', 'Courier New', monospace">d2d6b7c6-31f3-476d-8987-b11c551e9990.private.uhp.ca-mon.elasticsearch.datase…</text>
  <!-- Copy icon hostname -->
  <rect x="724" y="340" width="16" height="16" rx="2" fill="none" stroke="#525252" stroke-width="1.2"/>
  <rect x="728" y="336" width="16" height="16" rx="2" fill="#ffffff" stroke="#525252" stroke-width="1.2"/>

  <!-- Port box -->
  <rect x="778" y="328" width="710" height="46" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="796" y="356" font-size="13" fill="#161616" font-family="'IBM Plex Mono', 'Courier New', monospace">9200</text>
  <!-- Copy icon port -->
  <rect x="1459" y="340" width="16" height="16" rx="2" fill="none" stroke="#525252" stroke-width="1.2"/>
  <rect x="1463" y="336" width="16" height="16" rx="2" fill="#ffffff" stroke="#525252" stroke-width="1.2"/>

  <!-- Info note -->
  <circle cx="36" cy="420" r="9" fill="none" stroke="#525252" stroke-width="1.2"/>
  <text x="36" y="424" font-size="11" fill="#525252" text-anchor="middle" font-weight="700">i</text>
  <text x="52" y="424" font-size="13" fill="#525252">Gen 2 uses Let's Encrypt certificates instead of TLS certificates.</text>

  <!-- ── Bottom two-column section ── -->
  <rect x="0" y="530" width="1512" height="330" fill="#f4f4f4"/>

  <!-- Left card: Observability -->
  <rect x="16" y="546" width="730" height="298" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="36" y="586" font-size="15" font-weight="600" fill="#161616">Observability</text>
  <text x="36" y="612" font-size="13" fill="#525252">Optimize log analysis and management for rapid issue resolution and proactively avoid downtime.</text>

  <!-- IBM Cloud Logs link -->
  <text x="36" y="644" font-size="13" fill="#0f62fe">IBM Cloud Logs</text>
  <!-- external link icon -->
  <rect x="124" y="633" width="11" height="11" rx="1" fill="none" stroke="#0f62fe" stroke-width="1.2"/>
  <polyline points="129,633 135,633 135,639" fill="none" stroke="#0f62fe" stroke-width="1.2"/>
  <line x1="128" y1="640" x2="135" y2="633" stroke="#0f62fe" stroke-width="1.2"/>

  <text x="36" y="678" font-size="13" fill="#525252">Offers visibility into the performance and health of your infrastructure and apps, with in-depth</text>
  <text x="36" y="696" font-size="13" fill="#525252">troubleshooting and alerting.</text>

  <!-- IBM Cloud Monitoring link -->
  <text x="36" y="730" font-size="13" fill="#0f62fe">IBM Cloud Monitoring</text>
  <!-- external link icon -->
  <rect x="158" y="719" width="11" height="11" rx="1" fill="none" stroke="#0f62fe" stroke-width="1.2"/>
  <polyline points="163,719 169,719 169,725" fill="none" stroke="#0f62fe" stroke-width="1.2"/>
  <line x1="162" y1="726" x2="169" y2="719" stroke="#0f62fe" stroke-width="1.2"/>

  <!-- Right card: Most recent task -->
  <rect x="762" y="546" width="734" height="298" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="782" y="586" font-size="15" font-weight="600" fill="#161616">Most recent task</text>

  <!-- Divider under heading -->
  <line x1="762" y1="600" x2="1496" y2="600" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Task row -->
  <text x="782" y="638" font-size="13" fill="#161616">Provision completed successfully</text>
  <!-- Green check circle -->
  <circle cx="1028" cy="633" r="9" fill="#24a148"/>
  <polyline points="1023,633 1027,637 1034,628" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="1044" y="638" font-size="13" fill="#525252">Completed</text>
  <text x="1430" y="638" font-size="13" fill="#525252">52 days ago</text>

  <!-- Divider -->
  <line x1="762" y1="760" x2="1496" y2="760" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Learn how row -->
  <text x="782" y="794" font-size="13" fill="#525252">Learn how to track more events in your instance</text>
  <!-- Chevron down -->
  <polyline points="1478,786 1485,793 1492,786" fill="none" stroke="#525252" stroke-width="1.8"/>

</svg>
